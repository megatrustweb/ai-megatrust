version: 1.3.18
cache: true

# --- Token/credit quota (MegaBot-style) ---
# Each user gets a credit allotment; API-backed models spend it.
# For "unlimited on local model", give a generous startBalance (local use is cheap)
# or disable balance entirely. Admins can top up per user from the Admin Panel.
balance:
  enabled: true
  startBalance: 1000000
  autoRefillEnabled: false
  display: 'credits'

# Controlled pilot: only admins create accounts (registration is also gated by .env)
interface:
  modelSelect: true
  parameters: true
  agents: true

endpoints:
  # Free / low-cost providers (OpenAI-compatible). Keys come from .env.
  # Leave a key blank in .env to hide that provider.
  custom:
    - name: 'Groq'
      apiKey: '${GROQ_API_KEY}'
      baseURL: 'https://api.groq.com/openai/v1'
      models:
        default: ['llama-3.3-70b-versatile']
        fetch: true
      titleConvo: true
      titleModel: 'llama-3.1-8b-instant'
      modelDisplayLabel: 'Groq (free)'
    - name: 'OpenRouter'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      models:
        default: ['meta-llama/llama-3.3-70b-instruct:free', 'deepseek/deepseek-chat-v3-0324:free']
        fetch: true
      titleConvo: true
      titleModel: 'meta-llama/llama-3.3-70b-instruct:free'
      modelDisplayLabel: 'OpenRouter'

  # Agents framework (per-user/agent tools + MCP) — the "Agentic" capability.
  # AI providers (Anthropic / OpenAI) are enabled via API keys in .env.
  agents:
    recursionLimit: 25
    maxRecursionLimit: 50
    capabilities:
      - 'execute_code'
      - 'file_search'
      - 'actions'
      - 'tools'
      - 'artifacts'
      - 'ocr'
      - 'web_search'
